# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI/CD

on:
  push:
    branches: [ "master" ]
 
jobs:
  build:

    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    # The dependency tree predates npm's strict peer resolution, so the
    # legacy resolver is required — same as ci.yml. Without this flag npm ci
    # fails EUSAGE: the lock is only valid under the legacy resolver.
    # --no-audit/--no-fund trim memory and time on the small runner.
    - name: Ensure swap space
      run: |
        swapon --show | grep -q . && { echo "swap already active"; exit 0; }
        if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
        if ! $SUDO true 2>/dev/null; then
          echo "::warning::no swap and no root/passwordless sudo; npm ci may be OOM-killed"
          exit 0
        fi
        if [ ! -e /swapfile ]; then
          $SUDO fallocate -l 4G /swapfile
          $SUDO chmod 600 /swapfile
          $SUDO mkswap /swapfile
          grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | $SUDO tee -a /etc/fstab
        fi
        $SUDO swapon /swapfile || echo "::warning::swapon failed; continuing without swap"
        free -h
    - run: npm ci --legacy-peer-deps --no-audit --no-fund
    - run: npm run build
    - run: |
            touch .env
            echo "${{ secrets.PROD_ENV_FILE }}" > .env
    # - run: npm run build --if-present
    # - run: npm test
